<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MuJoCo VR Teleop</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="info">Connecting...</div>
    <div id="status-bar"><span id="rec-dot"></span><span id="status-text">Ready</span></div>
    <div id="vr-controls"></div>
    <div id="mode-splash">
      <button class="mode-tile" id="mode-tile-xr" type="button">
        <span class="mode-tile-title">XR</span>
        <span class="mode-tile-subtitle">(passthrough)</span>
      </button>
      <button class="mode-tile" id="mode-tile-vr" type="button">
        <span class="mode-tile-title">VR</span>
        <span class="mode-tile-subtitle">(immersive)</span>
      </button>
      <button class="mode-tile" id="mode-tile-browser" type="button">
        <span class="mode-tile-title">Browser</span>
        <span class="mode-tile-subtitle">(orbit camera, no headset)</span>
      </button>
    </div>
  </body>
  </html>
